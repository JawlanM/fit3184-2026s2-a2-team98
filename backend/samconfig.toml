version = 0.1

[default.global.parameters]
stack_name = "ecoguard"

[default.build.parameters]
use_container = false         # the layer is pre-built for Linux by scripts/build_layer.py
cached = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
region = "ap-southeast-2"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true             # SAM creates and reuses its own artifact bucket
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "AllowedOrigin=\"http://localhost:5173\" WebAppUrl=\"http://localhost:5173\""
